name: Quality

on:
  pull_request:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependency advisories
        run: pnpm audit --audit-level high
      - name: Build workspace packages
        run: pnpm package:build
      - name: Check source quality
        run: pnpm quality:check
      - name: Test packed package consumers
        run: pnpm package:smoke
      - name: Test Compose components
        run: pnpm test:coverage --maxWorkers=2
      - name: Test command-modal coverage
        run: pnpm -F @easy-shadcn/command-modal test:coverage --maxWorkers=2
      - name: Test command-modal types
        run: pnpm -F @easy-shadcn/command-modal test:types

  build:
    name: Types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm package:build
      - name: Generate examples and route types
        run: |
          pnpm generate-example
          pnpm exec next typegen
      - name: Check project and Compose type fixtures
        run: pnpm exec tsc --noEmit --incremental false
      - name: Build registry and documentation site
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser interaction and accessibility checks
        run: pnpm test:browser
      - name: Test fresh registry consumer
        run: pnpm registry:smoke
