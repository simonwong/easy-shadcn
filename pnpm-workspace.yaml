# pnpm-workspace.yaml
packages:
  - 'packages/*'
overrides:
  # Newer nwsapi native selector fallbacks recurse through jsdom Element.matches.
  "jsdom>nwsapi": "2.2.23"
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack-exhaustion DoS has no patched release. It is reached
    # only via fast-glob/micromatch in shadcn and @changesets/cli, which expand
    # repo-authored glob patterns at build time, never untrusted input.
    - GHSA-vfj7-8cjw-p6xm
# pnpm 10 skipped these scripts with a warning; pnpm 11+ fails install unless
# each is listed. Neither is needed: esbuild ships its binary as an optional
# platform package, and msw's script copies a service worker we never serve.
allowBuilds:
  esbuild: false
  msw: false
